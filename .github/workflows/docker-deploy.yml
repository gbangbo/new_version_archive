name: Docker Build & Deploy

on:
  push:
    branches:
      - main

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4

      - name: Se connecter à GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extraire les métadonnées de l'image
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest
            type=sha,prefix=sha-

      - name: Construire et pousser l'image Docker
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  deploy:
    runs-on: self-hosted
    needs: build-and-push

    steps:
      - name: Se connecter à GitHub Container Registry
        shell: powershell
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

      - name: Récupérer la nouvelle image
        shell: powershell
        run: docker pull ghcr.io/${{ github.repository }}:latest

      - name: Arrêter et supprimer l'ancien container
        shell: powershell
        run: |
          $exists = docker ps -a --filter "name=logiciel-plus" --format "{{.Names}}"
          if ($exists) {
            docker stop logiciel-plus
            docker rm logiciel-plus
          }

      - name: Démarrer le nouveau container
        shell: powershell
        run: |
          docker run -d `
            --name logiciel-plus `
            --restart unless-stopped `
            -p 80:80 `
            ghcr.io/${{ github.repository }}:latest

      - name: Nettoyer les anciennes images
        shell: powershell
        run: docker image prune -f
