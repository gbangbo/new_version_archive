<div class="container">
    <div class="grid grid-cols-12">
        <div class="col-span-12 xl:col-span-12">

            <div class="page-wrapper">

                <!-- Header -->
                <div class="bvpn-header">
                    <div class="bvpn-left">
            <span class="bvpn-title">
              <img src="assets/images/logo/logo_apw_full.png" alt="logo" class="logo-header">
            </span>
                        <span class="bvpn-divider">
            <svg width="12" height="50" viewBox="0 0 12 50" fill="none" xmlns="http://www.w3.org/2000/svg">
              <path d="M6 0 C10 6, 2 12, 6 18 C10 24, 2 30, 6 36 C10 42, 2 48, 6 50"
                    stroke="rgba(255,255,255,0.8)" stroke-width="1.5" fill="none" stroke-linecap="round"/>
            </svg>
          </span>
                        <span class="bvpn-subtitle">
              <b style="text-transform: capitalize; font-weight: bold">Archive Pro Web</b> est une plateforme de Gestion Électronique de Documents (GED). <br>
              Du chaos documentaire à une gestion numérique sécurisée et intelligente.
            </span>
                    </div>
                </div>

                <!-- Login Card -->
                <div class="login-card login-dark">
                    <div>
                        <div class="login-main" style="display: flex; flex-direction: column;">

                            <form class="theme-form" [formGroup]="loginForm" (ngSubmit)="login()">
                                <h4>Renouvellement de mot de passe</h4>
                                <p>Entrez votre identifiant.</p>
                                <!-- Emplacement réservé : toujours présent, même vide, pour que
                                     l'apparition d'un message ne fasse pas grandir la carte. -->
                                <div class="form-message" *ngIf="errorTexte || succesTexte">
                                    <div class="alert alert-danger form-alert" role="alert" *ngIf="errorTexte">
                                        <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="feather feather-alert-circle stroke-danger"><circle cx="12" cy="12" r="10"></circle><line x1="12" y1="8" x2="12" y2="12"></line><line x1="12" y1="16" x2="12" y2="16"></line></svg>
                                        <span class="txt-light">{{ errorTexte }}</span>
                                    </div>
                                    <!-- Confirmation d'envoi : sans elle, l'utilisateur reste
                                         devant un formulaire inchangé, sans savoir si le mail est parti. -->
                                    <div class="alert alert-success form-alert" role="status" *ngIf="succesTexte">
                                        <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="feather feather-check-circle"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"></path><polyline points="22 4 12 14.01 9 11.01"></polyline></svg>
                                        <span class="txt-light">{{ succesTexte }}</span>
                                    </div>
                                </div>
                                <div class="form-group">
                                    <label class="col-form-label">Votre adresse mail</label>
                                    <div class="form-input relative">
                                        <div class="input-with-icon">
                                            <i class="icofont icofont-email"></i>
                                            <input class="form-control with-icon" type="email" placeholder="Votre adresse mail" formControlName="email">
                                        </div>
<!--                                        <input class="form-control" type="email" name="email" placeholder="Entrez votre adresse mail" formControlName="email">-->
                                    </div>
                                </div>
                                <div class="form-group mb-0">
                                    <a class="link" [routerLink]="['/auth/connexion']">Se connecter</a>
                                    <div class="text-end">
                                        <button class="btn btn-primary btn-block w-full text-white mt-[24px] btnCnx"
                                                type="submit" [disabled]="!loginForm.valid || loading">
                                            <i class=" {{!loading ? '':'fas fa-spin fa-circle-notch'}}"></i>&nbsp; {{ loading ? 'Envoi en cours…' : 'Réinitialiser' }}</button>
                                    </div>

                                </div>
                            </form>

                        </div>
                    </div>
                </div>

                <!-- Footer en dehors de la card -->
                <div class="login-footer">
                    <p class="footer-text">
                        Build v4.0.0
                        <i class="icofont icofont-heart-alt" style="color:#ad0631"></i>
                        <a class="ms-2" href="https://www.logicielplus.net/" target="_blank">By Logiciel +</a>
                    </p>
                </div>

            </div>
            <!-- fin page-wrapper -->

        </div>
    </div>
</div>
