<div class="logo-wrapper">
    <a href="javascript:void(0)" [routerLink]="['/']" style="display: flex; align-items: center; gap: 12px; text-decoration: none;">
        <img style="width: 30px; height: auto;" class="max-w-full for-light" src="assets/images/logo/logo_apw_full.png" alt="logo">
        <img  style="width: 30px; height: auto;" class="max-w-full for-dark"  src="assets/images/logo/logo_apw_full.png" alt="logo">
        <b style="color: #ffffff; font-size: 15px; font-weight: 600; letter-spacing: 0.02em;">{{users?.datasociete?.raison_sociale}}</b>
    </a>
</div>

@if(type == 'header') {
    <ng-content></ng-content>
    
    <div class="toggle-sidebar" (click)="toggleSidebar()">
        <app-feather-icon [icon]="icon" [class]="'status_toggle middle sidebar-toggle'"></app-feather-icon>
    </div>
}
