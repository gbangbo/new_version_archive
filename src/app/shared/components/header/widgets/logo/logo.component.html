<div class="logo-wrapper">
    <a href="javascript:void(0)" [routerLink]="['/']" style="display: flex; align-items: center; gap: 12px; text-decoration: none;">
        <span class="logo-badge">
            <img class="for-light" src="assets/images/logo/logo_apw_full.png" alt="logo">
            <img class="for-dark"  src="assets/images/logo/logo_apw_full.png" alt="logo">
        </span>
        <!-- font-weight 500 et non 600 : avec les deux faces Cocon (400 et 700),
             600 est arrondi vers le haut et tape dans le gras, trop lourd ici.
             500 retombe sur le Regular sans déclencher de gras synthétique. -->
        <b style="color: #ffffff; font-size: 13px; font-weight: 500; letter-spacing: 0.02em;">{{users?.datasociete?.raison_sociale}}</b>
    </a>
    <ng-content></ng-content>
</div>

@if(type == 'header') {
    <div class="toggle-sidebar" (click)="toggleSidebar()">
        <app-feather-icon [icon]="icon" [class]="'status_toggle middle sidebar-toggle'"></app-feather-icon>
    </div>
}
