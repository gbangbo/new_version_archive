<app-card [cardClass]="'live-auction-wrapper'" [padding]="false" [headerTitle]="'Flash Info'" [cardBodyClass]="'pt-0'">

    <!-- ══ NAVIGATION (dans l'en-tête, à droite) ══════════════ -->
    <div header5 class="fi-nav" *ngIf="liveAuction.length > 0">
        <button class="fi-nav-btn" (click)="owlCar.prev()" [disabled]="atStart" title="Précédent">
            <i class="fa-solid fa-chevron-left"></i>
        </button>
        <button class="fi-nav-btn" (click)="owlCar.next()" [disabled]="atEnd" title="Suivant">
            <i class="fa-solid fa-chevron-right"></i>
        </button>
    </div>

    <div class="relative">

        <!-- Overlay chargement -->
        <div *ngIf="isloading"
             class="absolute inset-0 flex justify-center items-center z-10 rounded-lg"
             style="background: rgba(248,250,252,0.85); backdrop-filter: blur(2px);">
            <div class="text-center">
                <div class="op-spinner"></div>
                <p class="mt-3" style="color:#64748b; font-size:13px; font-weight:600;">
                    Chargement des données...
                </p>
            </div>
        </div>

        <div [class.op-loading]="isloading">

        <!-- État vide -->
        <div class="fi-widget-empty" *ngIf="!isloading && liveAuction.length === 0">
            <i class="fa-solid fa-bolt"></i>
            <span>Aucun flash info</span>
        </div>

    <div class="slider-wrapper arrow-round" [hidden]="liveAuction.length === 0">
        <owl-carousel-o #owlCar [options]="options" class="swiper live-auction-slider"
                        (initialized)="onSlideChange($event)"
                        (translated)="onSlideChange($event)"
                        (changed)="onSlideChange($event)">
            @for(auction of liveAuction; track auction) {
                <ng-template carouselSlide>
                    <div class="product-card">

                        <!-- Description (remplace l'ancienne section image) -->
                        <div class="product-description">
                            <p class="desc-text">{{ getDescription(auction) }}</p>
                            <button *ngIf="needsExpand(auction)"
                                    class="desc-lire-btn"
                                    (click)="toggleExpand(auction.id, $event)">
                                {{ isExpanded(auction.id) ? 'Réduire' : 'Lire la suite' }}
                                <app-feather-icon
                                    [icon]="isExpanded(auction.id) ? 'chevron-up' : 'chevron-down'"
                                    class="lire-icon">
                                </app-feather-icon>
                            </button>
                        </div>

                        <div class="product-nft-content">
<!--                            <h6 class="f-14">{{ auction.name }}</h6>-->

                            <div class="common-flex">
                                <button class="btn bg-light-primary font-primary" type="button">
                                    <span class="common-align">
                                        <app-svg-icon [icon]="'stop-watch'"></app-svg-icon>
                                        <span class="f-light font-medium timer">{{ auction.date_debut ?? '—' }}</span>
                                    </span>
                                </button>
                                <a class="btn bg-light-primary font-primary font-medium">
                                    {{ auction.date_fin ?? '—' }}
                                </a>
                            </div>
                        </div>

                    </div>
                </ng-template>
            }
        </owl-carousel-o>
        </div><!-- /.slider-wrapper -->
        </div><!-- /.op-loading -->

    </div><!-- /.relative -->

</app-card>
