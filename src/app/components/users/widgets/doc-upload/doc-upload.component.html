<div class="doc-upload-container">

    <!-- Zone de drop/click -->
    <div class="doc-preview"
         [class.has-file]="selectedFile"
         (click)="!selectedFile && fileInput.click()"
         (dragover)="onDragOver($event)"
         (dragleave)="onDragLeave($event)"
         (drop)="onDrop($event)"
         [class.drag-over]="isDragging">

        <!-- État : aucun fichier -->
        <div class="upload-placeholder" *ngIf="!selectedFile">
            <div class="upload-icon">
                <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
                    <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
                    <polyline points="17 8 12 3 7 8"/>
                    <line x1="12" y1="3" x2="12" y2="15"/>
                </svg>
            </div>
            <span class="upload-title">{{ placeholder }}</span>
            <span class="upload-subtitle">Glissez-déposez ou cliquez pour sélectionner</span>
            <span class="upload-formats">Formats acceptés : PDF</span>
        </div>

        <!-- État : fichier sélectionné -->
        <div class="file-card" *ngIf="selectedFile">

            <!-- Header : icône + infos + actions -->
            <div class="file-header">
                <div class="file-icon" [ngClass]="getFileIconClass()">
                    <svg *ngIf="isPdf()" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
                        <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/>
                        <polyline points="14 2 14 8 20 8"/>
                        <line x1="16" y1="13" x2="8" y2="13"/>
                        <line x1="16" y1="17" x2="8" y2="17"/>
                        <polyline points="10 9 9 9 8 9"/>
                    </svg>
                    <svg *ngIf="!isPdf()" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
                        <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/>
                        <polyline points="14 2 14 8 20 8"/>
                    </svg>
                </div>

                <div class="file-details">
                    <span class="file-name">{{ selectedFile.name }}</span>
                    <span class="file-size">{{ formatFileSize(selectedFile.size) }}</span>
                </div>

                <div class="file-actions">
                    <button type="button" class="btn-change" (click)="fileInput.click()" title="Changer">
                        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/>
                            <path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/>
                        </svg>
                    </button>
                    <button type="button" class="btn-remove-doc" (click)="removeFile($event)" title="Supprimer">
                        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <polyline points="3 6 5 6 21 6"/>
                            <path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/>
                            <path d="M10 11v6M14 11v6"/>
                            <path d="M9 6V4a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v2"/>
                        </svg>
                    </button>
                </div>
            </div>

            <!-- Prévisualisation PDF -->
            <div class="file-preview" *ngIf="isPdf() && previewObjectUrl">
                <iframe
                        [src]="previewObjectUrl"
                        width="100%"
                        height="400px"
                        style="border: none; border-radius: 0 0 6px 6px;">
                </iframe>
            </div>

            <!-- Pas de prévisualisation pour DOC/DOCX -->
            <div class="file-no-preview" *ngIf="!isPdf()">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#94A3B8" stroke-width="1.5">
                    <circle cx="12" cy="12" r="10"/>
                    <line x1="12" y1="8" x2="12" y2="12"/>
                    <line x1="12" y1="16" x2="12.01" y2="16"/>
                </svg>
                <span>Prévisualisation non disponible pour ce format</span>
            </div>

        </div>

    </div>

    <input
        #fileInput
        type="file"
        [accept]="acceptedFormats"
        (change)="onFileSelected($event)"
        style="display: none;" />

    <div class="error-message" *ngIf="errorMessage">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <circle cx="12" cy="12" r="10"/>
            <line x1="12" y1="8" x2="12" y2="12"/>
            <line x1="12" y1="16" x2="12.01" y2="16"/>
        </svg>
        {{ errorMessage }}
    </div>

</div>
