<!-- ═══ MODAL : créer / modifier une fonction ════════════════════ -->
<!-- Même gabarit que le modal de Flash info (classes fi-*) -->
<div class="fi-backdrop">
    <div class="fi-panel">
        <div class="fi-header">
            <div class="fi-header-titles">
                <span class="fi-title">
                    <i class="fa-solid fa-user-tie"></i>
                    {{ validationForm.value.idfonction ? 'Modifier la fonction' : 'Nouvelle fonction' }}
                </span>
            </div>
            <button class="fi-close" type="button" (click)="closeModal()" title="Fermer">
                <i class="fa-solid fa-xmark"></i>
            </button>
        </div>

        <form [formGroup]="validationForm" (ngSubmit)="submitForm()">
            <div class="fi-body custom-input">
                <div class="fi-alert" *ngIf="errorTexte">
                    <i class="fa-solid fa-circle-exclamation"></i> {{ errorTexte }}
                </div>

                <div class="fi-field">
                    <label class="form-label" for="libelle_fonction">Libellé <span class="txt-danger">*</span></label>
                    <input class="fi-input" id="libelle_fonction" type="text"
                           placeholder="Intitulé de la fonction"
                           formControlName="libelle_fonction"
                           [class.fi-input-error]="validationForm.controls['libelle_fonction'].touched
                                                   && validationForm.controls['libelle_fonction'].errors?.['required']">
                    <span class="fi-error"
                          *ngIf="validationForm.controls['libelle_fonction'].touched
                                 && validationForm.controls['libelle_fonction'].errors?.['required']">
                        Veuillez saisir le libellé.
                    </span>
                </div>
            </div>

            <div class="fi-footer">
                <button class="fi-btn fi-btn-cancel" type="button" (click)="closeModal()">Annuler</button>
                <button class="fi-btn fi-btn-confirm" type="submit" [disabled]="isloading">
                    <i class="fa-solid" [ngClass]="isloading ? 'fa-circle-notch fa-spin' : 'fa-check'"></i>
                    {{ isloading ? 'Enregistrement…' : (validationForm.value.idfonction ? 'Modifier' : 'Créer') }}
                </button>
            </div>
        </form>
    </div>
</div>
