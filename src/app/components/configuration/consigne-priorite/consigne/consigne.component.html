<div class="container main-setting">
    <div class="grid grid-cols-12 card-gap">
        <div class="col-span-12">
            <app-card [border]="true" [padding]="false">

                <div class="grid grid-cols-12 gap-4 tabs">
                    <div class="col-span-12">
                        <div class="relative">

                            <!-- ══ OVERLAY SPINNER ══════════════════════════════ -->
                            <div *ngIf="isloading"
                                 class="absolute inset-0 flex justify-center items-center z-10 rounded-lg"
                                 style="background: rgba(248,250,252,0.85); backdrop-filter: blur(2px);">
                                <div class="text-center">
                                    <div class="op-spinner"></div>
                                    <p class="mt-3" style="color:#64748b; font-size:13px; font-weight:600;">
                                        Chargement des données...
                                    </p>
                                </div>
                            </div>
                            <div class="table-container" [class.op-loading]="isloading">
                                <!-- ══ TOOLBAR ══════════════════════════════════ -->
                                <div class="op-toolbar">
                                    <!-- Titre + compteur -->
                                    <div class="op-toolbar-left">
                                        <div class="op-toolbar-title">
                                            <div class="op-toolbar-icon">
                                                <i class="far fa-clipboard"></i>
                                            </div>
                                            <div>
                                                <span class="op-toolbar-label">LISTE DES CONSIGNES</span>
                                                <span class="op-toolbar-count">
                                                    {{ filteredData.length || 0 }} enregistrement(s)
                                                </span>
                                            </div>
                                        </div>
                                    </div>

                                    <!-- Actions droite -->
                                    <div class="op-toolbar-right">

                                        <!-- Recherche -->
                                        <div class="op-search-wrap">
                                            <svg class="op-search-icon" viewBox="0 0 24 24" fill="none"
                                                 stroke="currentColor" stroke-width="2" stroke-linecap="round">
                                                <circle cx="11" cy="11" r="8"/>
                                                <line x1="21" y1="21" x2="16.65" y2="16.65"/>
                                            </svg>
                                            <input class="op-search-input"
                                                   placeholder="Rechercher..."
                                                   [(ngModel)]="searchValue"
                                                   (ngModelChange)="onSearch($event)"/>
                                            <button *ngIf="searchValue"
                                                    class="op-search-clear"
                                                    (click)="searchValue=''; onSearch('')">
                                                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"
                                                     stroke-width="2.5" stroke-linecap="round" width="12" height="12">
                                                    <line x1="18" y1="6" x2="6" y2="18"/>
                                                    <line x1="6" y1="6" x2="18" y2="18"/>
                                                </svg>
                                            </button>
                                        </div>

                                        <button class="op-btn op-btn-outline"
                                                nz-tooltip nzTooltipTitle="Nouvelle consigne"
                                                (click)="openModal()">
                                            <i data-feather="edit-2" style="width: 15px;"></i>
                                            <span class="btn-label">Nouveau</span>
                                        </button>
                                    </div>
                                </div>

                                <!-- ══ TABLE ════════════════════════════════════ -->

                                <div class="tt-scroll-shell" [class.tt-more-right]="hScrollMore">
                                <div class="tree-table-wrap" #tableWrap (scroll)="syncHScroll()">

                                    <!-- Entête colonnes -->
                                    <div class="tree-table-header">
                                        <div class="ttc-name" (click)="sortBy('libconsigne')">
                                            Libellé
                                            <span class="tt-sort-icons">
                                                <span class="tt-sort-up"
                                                      [class.tt-sort-active]="sortKey === 'libconsigne' && sortOrder === 'asc'">↑</span>
                                                <span class="tt-sort-down"
                                                      [class.tt-sort-active]="sortKey === 'libconsigne' && sortOrder === 'desc'">↓</span>
                                            </span>
                                        </div>
                                        <div class="ttc-cree" (click)="sortBy('created_at')">
                                            Créé le
                                            <span class="tt-sort-icons">
                                                <span class="tt-sort-up"
                                                      [class.tt-sort-active]="sortKey === 'created_at' && sortOrder === 'asc'">↑</span>
                                                <span class="tt-sort-down"
                                                      [class.tt-sort-active]="sortKey === 'created_at' && sortOrder === 'desc'">↓</span>
                                            </span>
                                        </div>
                                        <div class="ttc-actions">Actions</div>
                                    </div>

                                    <!-- Lignes -->
                                    <div class="tree-table-body">
                                        <div class="tt-row" *ngFor="let row of rowsPage">
                                            <div class="ttc-name">
                                                <span class="tt-name-text tt-parent"
                                                      [innerHTML]="highlightMatch(row.libconsigne, searchValue)">
                                                </span>
                                            </div>
                                            <div class="ttc-cree">
                                                <span [innerHTML]="highlightMatch(row.created_at, searchValue)"></span>
                                            </div>
                                            <div class="ttc-actions">
                                                <button class="btn-round-edit tt-action-btn"
                                                        nz-tooltip nzTooltipTitle="Modifier la consigne"
                                                        nzTooltipPlacement="top"
                                                        (click)="openModal(row)">
                                                    <app-feather-icon class="icon-small" [icon]="'edit-3'"></app-feather-icon>
                                                </button>
                                            </div>
                                        </div>

                                        <!-- Empty state -->
                                        <div *ngIf="!isloading && !filteredData.length" class="op-empty-state">
                                            <app-feather-icon class="icon-inbox" [icon]="'inbox'"></app-feather-icon>
                                            <span>Aucune donnée trouvée !</span>
                                            <small *ngIf="searchValue">
                                                Aucun résultat pour « {{ searchValue }} »
                                            </small>
                                        </div>
                                    </div>
                                </div>
                                </div>

                                <!-- Ascenseur horizontal dessiné (visible en permanence) -->
                                <div class="tt-hscroll" *ngIf="hScrollVisible" #hBar
                                     (pointerdown)="onBarPointerDown($event)">
                                    <div class="tt-hscroll-thumb"
                                         [style.width.px]="thumbWidth"
                                         [style.left.px]="thumbLeft"></div>
                                </div>

                                <!-- Footer : hors de la zone de défilement -->
                                <div class="tree-table-footer">
                                    <span class="tt-total">
                                        Total : <strong>{{ filteredData.length }}</strong> enregistrement(s)
                                    </span>

                                    <div class="tt-pager" *ngIf="filteredData.length">
                                        <select class="tt-pager-taille"
                                                [ngModel]="pageSize"
                                                (ngModelChange)="changerTaille($event)"
                                                title="Lignes par page">
                                            <option *ngFor="let t of taillesPage" [ngValue]="t">{{ t }} / page</option>
                                        </select>

                                        <button class="tt-pager-btn" type="button"
                                                [disabled]="pageIndex <= 1"
                                                (click)="allerPage(pageIndex - 1)"
                                                title="Page précédente">
                                            <i class="fa-solid fa-chevron-left"></i>
                                        </button>

                                        <span class="tt-pager-page">{{ pageIndex }} / {{ nbPages }}</span>

                                        <button class="tt-pager-btn" type="button"
                                                [disabled]="pageIndex >= nbPages"
                                                (click)="allerPage(pageIndex + 1)"
                                                title="Page suivante">
                                            <i class="fa-solid fa-chevron-right"></i>
                                        </button>
                                    </div>
                                </div>

                            </div>
                        </div>
                    </div>
                </div>

            </app-card>
        </div>
    </div>
    @if(modalOpen){
    <app-consigne-modal  [dataLigne]="dataLigne" (modalOpen)="handleModal($event)"></app-consigne-modal>
    }
</div>
