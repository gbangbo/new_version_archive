<!-- Même charte que le popup de /flash-infos : fond sombre, panneau navy, pied a deux boutons -->
<div class="fi-backdrop">
    <div class="fi-panel">
        <div class="fi-header">
            <div class="fi-header-titles">
                <span class="fi-title">
                    <i class="fa-solid fa-sitemap"></i> {{ title }}
                </span>
            </div>
            <button class="fi-close" type="button" (click)="closeModal()" title="Fermer">
                <i class="fa-solid fa-xmark"></i>
            </button>
        </div>

        <form [formGroup]="validationForm" (ngSubmit)="submitForm()" novalidate>
            <div class="fi-body custom-input">

                <div class="fi-alert" [class.fi-alert-info]="typeAlerte == 'prim'" *ngIf="errorTexte">
                    <i class="fa-solid" [ngClass]="typeAlerte == 'prim' ? 'fa-circle-info' : 'fa-circle-exclamation'"></i>
                    <span>{{ errorTexte }}</span>
                </div>

                <div class="fi-field">
                    <label class="form-label" for="idsociete">
                        Raison sociale <span class="txt-danger">*</span>
                    </label>
                    <nz-tree-select
                            id="idsociete"
                            class="fi-treeselect"
                            [class.fi-select-invalid]="champEnErreur('idsociete')"
                            [nzDisabled]="is"
                            [nzAsyncData]="isload"
                            [nzExpandedKeys]="expandKeys"
                            [nzNodes]="dataSociete"
                            nzShowSearch
                            nzPlaceHolder="Sélectionnez la société"
                            formControlName="idsociete"
                    />
                    @if (champEnErreur('idsociete')) {
                        <small class="fi-error">Veuillez sélectionner la société.</small>
                    }
                </div>

                <div class="fi-field">
                    <label class="form-label" for="sigle">
                        Sigle <span class="txt-danger">*</span>
                    </label>
                    <input class="fi-input" id="sigle" type="text"
                           placeholder="Entrez le sigle (ex. : DG)"
                           formControlName="sigle"
                           [class.fi-input-invalid]="champEnErreur('sigle')">
                    @if (champEnErreur('sigle')) {
                        <small class="fi-error">Veuillez saisir le sigle.</small>
                    }
                </div>

                <div class="fi-field">
                    <label class="form-label" for="libelle">
                        Libellé <span class="txt-danger">*</span>
                    </label>
                    <input class="fi-input" id="libelle" type="text"
                           placeholder="Entrez le libellé du niveau"
                           formControlName="libelle"
                           [class.fi-input-invalid]="champEnErreur('libelle')">
                    @if (champEnErreur('libelle')) {
                        <small class="fi-error">Veuillez saisir le libellé.</small>
                    }
                </div>

            </div>

            <div class="fi-footer">
                <button class="fi-btn fi-btn-cancel" type="button" (click)="closeModal()">Annuler</button>
                <button class="fi-btn fi-btn-confirm" type="submit" [disabled]="isloading">
                    <i class="fa-solid" [ngClass]="isloading ? 'fa-circle-notch fa-spin' : (isEdit ? 'fa-check' : 'fa-plus')"></i>
                    {{ isloading ? 'Enregistrement…' : (isEdit ? 'Modifier' : 'Créer') }}
                </button>
            </div>
        </form>
    </div>
</div>
