<div class="modal  fade show modal-backdrop">
    <div class="modal-dialog modal-dialog-centered modal-md">
        <div class="modal-content category-popup">
            <div class="modal-header">
                <h5 class="modal-title">
                    {{title}}
                </h5>
                <button class="btn-close" type="button" data-bs-dismiss="modal" aria-label="Close" (click)="closeModal()"></button>
            </div>
            <div class="modal-body p-0 custom-input">
                <div class="text-start">
                    <div class="p-20">
                        <div class="alert alert-{{typeAlerte}} flex items-center gap-3" role="alert"
                             style="animation: slideDown 0.3s ease;" *ngIf="errorTexte">
                            <div>
                                <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="feather feather-alert-circle stroke-danger">
                                    <circle cx="12" cy="12" r="10"></circle>
                                    <line x1="12" y1="8" x2="12" y2="12"></line>
                                    <line x1="12" y1="16" x2="12.01" y2="16"></line>
                                </svg>
                            </div>
                            <span class="txt-light">{{errorTexte}}</span>
                        </div>
                        <form class="grid grid-cols-12 gap-4 needs-validation" novalidate="" [formGroup]="validationForm" (ngSubmit)="submitForm()">
                            <div class="col-span-6">
                                <label class="form-label" for="raison_sociale">Raison sociale
                                    <span class="txt-danger">*</span>
                                </label>
                                <input class="form-control" id="raison_sociale" type="text" placeholder="Entrez la raison sociale" formControlName="raison_sociale"
                                       [ngClass]="{ 'is-invalid' : validationForm.controls['raison_sociale'].touched &&  validationForm.controls['raison_sociale'].errors?.['required'] , 'is-valid' : validationForm.controls['raison_sociale'].valid}">
                                @if(validationForm.controls['raison_sociale'].valid) {
                                <!--<div class="valid-feedback">Looks's Good!</div>-->
                                } @else if(validationForm.controls['raison_sociale'].touched && validationForm.controls['raison_sociale'].errors?.['required']) {
                                <div class="invalid-feedback"> Veuillez saisir la raison sociale.</div>
                                }
                            </div>

                            <div class="col-span-6">
                                <label for="telephone" class="form-label text-left block mb-2">Téléphone</label>
                                <input class="form-control hSoc"
                                       formControlName="telephone"
                                       id="telephone"
                                       type="tel"
                                       placeholder="+225 XX XX XX XX XX">
                            </div>

                            <div class="col-span-6">
                                <label for="email" class="form-label text-left block mb-2">Adresse mail</label>
                                <input class="form-control hSoc"
                                       formControlName="email"
                                       id="email"
                                       type="email"
                                       placeholder="exemple@email.com">
                            </div>

                            <div class="col-span-6">
                                <label for="localisation" class="form-label text-left block mb-2">Localisation</label>
                                <input class="form-control hSoc"
                                       formControlName="localisation"
                                       id="localisation"
                                       type="text"
                                       placeholder="Ville, Pays">
                            </div>

                            <div class="col-span-6">
                                <label for="localisation" class="form-label text-left block mb-2">Rang</label>
                                <input class="form-control hSoc"
                                       formControlName="position"
                                       id="position"
                                       type="text"
                                       placeholder="Ex: 1">
                            </div>

                            <div class="col-span-6">
                                <label class="form-label text-left block mb-2">Logo</label>
                                <div class="photo-wrapper">
                                    <app-image-upload
                                            [placeholder]="'Photo'"
                                            [maxSizeInMB]="2"
                                            [existingImageUrl]="imageUrl || null"
                                            (fileSelected)="onImageSelected($event)"
                                            (fileRemoved)="onImageRemoved()">
                                    </app-image-upload>
                                </div>
                                <span style="font-size: 11px; color: #9CA3AF;">Taille Max 2MB</span>
                            </div>


                            <div class="col-span-6">
                                <label class="flex items-center gap-3 cursor-pointer" style="margin-top: 5% !important;">
                                    <nz-switch formControlName="double_auth"></nz-switch>
                                    <span class="form-label mb-0">Activer la double authentification</span>
                                </label>
                            </div>
                            <div class="col-span-6">
                                <label class="flex items-center gap-3 cursor-pointer" style="margin-top: 5% !important;">
                                    <nz-switch formControlName="actif" nzCheckedChildren="Actif" nzUnCheckedChildren="Desactivé" ></nz-switch>
                                    <span class="form-label mb-0">Statut de la société</span>
                                </label>
                            </div>

                            <div class="col-span-12 flex justify-end">
                                <button class="btn btn-primary text-white w-full mt-8 newBtn" type="submit">
                                    <i class="{{isloading?'fas fa-spin fa-circle-notch':''}}"></i>
                                    {{validationForm.value.uid ? 'Modifier':' Créer +'}}

                                </button>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
