<!-- Même charte que le popup de /flash-infos : fond sombre, panneau navy, pied à deux boutons -->
<div class="fi-backdrop">
    <div class="fi-panel">
        <div class="fi-header">
            <div class="fi-header-titles">
                <span class="fi-title">
                    <i class="fa-solid fa-building"></i> {{ title }}
                </span>
            </div>
            <button class="fi-close" type="button" (click)="closeModal()" title="Fermer">
                <i class="fa-solid fa-xmark"></i>
            </button>
        </div>

        <form [formGroup]="validationForm" (ngSubmit)="submitForm()" novalidate>
            <div class="fi-body custom-input">

                <div class="fi-alert" [class.fi-alert-info]="typeAlerte == 'prim'" *ngIf="errorTexte">
                    <i class="fa-solid" [ngClass]="typeAlerte == 'prim' ? 'fa-circle-info' : 'fa-circle-exclamation'"></i>
                    <span>{{ errorTexte }}</span>
                </div>

                <div class="fi-grid2">
                    <div class="fi-field">
                        <label class="form-label" for="raison_sociale">
                            Raison sociale <span class="txt-danger">*</span>
                        </label>
                        <input class="fi-input" id="raison_sociale" type="text"
                               placeholder="Entrez la raison sociale"
                               formControlName="raison_sociale"
                               [class.fi-input-invalid]="validationForm.controls['raison_sociale'].touched && validationForm.controls['raison_sociale'].errors?.['required']">
                        @if (validationForm.controls['raison_sociale'].touched && validationForm.controls['raison_sociale'].errors?.['required']) {
                            <small class="fi-error">Veuillez saisir la raison sociale.</small>
                        }
                    </div>

                    <div class="fi-field">
                        <label class="form-label" for="telephone">Téléphone</label>
                        <input class="fi-input" id="telephone" type="tel"
                               placeholder="+225 XX XX XX XX XX"
                               formControlName="telephone">
                    </div>

                    <div class="fi-field">
                        <label class="form-label" for="email">Adresse mail</label>
                        <input class="fi-input" id="email" type="email"
                               placeholder="exemple@email.com"
                               formControlName="email">
                    </div>

                    <div class="fi-field">
                        <label class="form-label" for="localisation">Localisation</label>
                        <input class="fi-input" id="localisation" type="text"
                               placeholder="Ville, Pays"
                               formControlName="localisation">
                    </div>

                    <div class="fi-field">
                        <label class="form-label" for="position">Rang</label>
                        <input class="fi-input" id="position" type="text"
                               placeholder="Ex: 1"
                               formControlName="position">
                    </div>

                    <div class="fi-field">
                        <label class="form-label">Logo</label>
                        <div class="photo-wrapper">
                            <app-image-upload
                                    [placeholder]="'Photo'"
                                    [maxSizeInMB]="2"
                                    [existingImageUrl]="imageUrl || null"
                                    (fileSelected)="onImageSelected($event)"
                                    (fileRemoved)="onImageRemoved()">
                            </app-image-upload>
                        </div>
                        <small class="fi-hint">Taille max. 2 Mo</small>
                    </div>
                </div>

                <div class="fi-switches">
                    <label class="fi-switch">
                        <nz-switch formControlName="double_auth"></nz-switch>
                        <span>Activer la double authentification</span>
                    </label>
                    <label class="fi-switch">
                        <nz-switch formControlName="actif" nzCheckedChildren="Actif"
                                   nzUnCheckedChildren="Désactivé"></nz-switch>
                        <span>Statut de la société</span>
                    </label>
                </div>

            </div>

            <div class="fi-footer">
                <button class="fi-btn fi-btn-cancel" type="button" (click)="closeModal()">Annuler</button>
                <button class="fi-btn fi-btn-confirm" type="submit" [disabled]="isloading">
                    <i class="fa-solid" [ngClass]="isloading ? 'fa-circle-notch fa-spin' : (isEdit ? 'fa-check' : 'fa-plus')"></i>
                    {{ isloading ? 'Enregistrement…' : (isEdit ? 'Modifier' : 'Créer') }}
                </button>
            </div>
        </form>
    </div>
</div>
