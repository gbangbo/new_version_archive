server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # Indispensable pour le routing Angular (SPA)
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Cache des assets statiques
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    # application/wasm et octet-stream : coeur OCR (2,8 Mo) et donnees de
    # langue Tesseract (1,1 Mo), telecharges au premier usage de la capture
    # par zone. Ils doivent rester NON pre-compresses sur le disque : un
    # fichier .gz repartirait avec Content-Encoding et casserait Tesseract.
    gzip_types text/plain text/css application/json application/javascript
               text/xml application/xml text/javascript
               application/wasm application/octet-stream;
}
